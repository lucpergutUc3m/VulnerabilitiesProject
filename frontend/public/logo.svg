<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">

  <rect width="100" height="100" fill="#6f1ca0" rx="10"/>  <!-- Background circle -->

  <text x="50" y="65" font-size="60" fill="white" text-anchor="middle" font-weight="bold">🚀</text>  <circle cx="100" cy="100" r="95" fill="#6f1ca0" opacity="0.1" stroke="#6f1ca0" stroke-width="2"/>

</svg>  

  <!-- Shield shape -->
  <path d="M 100 30 L 160 60 L 160 100 Q 100 150 100 150 Q 100 150 40 100 L 40 60 Z" 
        fill="#6f1ca0" stroke="#6f1ca0" stroke-width="2"/>
  
  <!-- Lock icon inside shield -->
  <g transform="translate(100, 100)">
    <!-- Lock body -->
    <rect x="-20" y="-5" width="40" height="35" rx="5" fill="white" stroke="white" stroke-width="2"/>
    
    <!-- Lock shackle -->
    <path d="M -15 -5 Q -15 -25 0 -25 Q 15 -25 15 -5" 
          fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Lock keyhole -->
    <circle cx="0" cy="10" r="4" fill="#6f1ca0"/>
  </g>
</svg>
