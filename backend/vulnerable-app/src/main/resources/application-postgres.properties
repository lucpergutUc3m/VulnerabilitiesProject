# PostgreSQL Configuration for Docker Compose
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vulnerableappdb}
spring.datasource.username=${DB_USERNAME:dbuser}
spring.datasource.password=${DB_PASSWORD:dbpassword}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}

# Disable H2 console when using PostgreSQL
spring.h2.console.enabled=false

# JPA Properties
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
