# Profile for PRODUCTION with Docker
# Secure configuration with all debug features disabled

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Security: Disable all debug features
spring.h2.console.enabled=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT - MUST be set via environment variables
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# CORS - MUST be set to production domain
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Production mode
app.vulnerability-mode=false
