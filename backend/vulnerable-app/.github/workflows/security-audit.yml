name: Security Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run security audit every Monday at midnight
    - cron: '0 0 * * 1'
  workflow_dispatch:  # Allow manual trigger

jobs:
  static-analysis:
    name: Static Security Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Run OWASP Dependency-Check
      run: ./mvnw org.owasp:dependency-check-maven:check
      continue-on-error: true
    
    - name: Run SpotBugs Security Analysis
      run: ./mvnw spotbugs:check
      continue-on-error: true
    
    - name: Upload Dependency-Check Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dependency-check-report
        path: target/dependency-check-report.html
        retention-days: 30
    
    - name: Upload SpotBugs Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: spotbugs-report
        path: target/spotbugs.html
        retention-days: 30

  dynamic-analysis:
    name: Dynamic Security Testing (ZAP)
    runs-on: ubuntu-latest
    needs: static-analysis
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Build application
      run: ./mvnw clean package -DskipTests
    
    - name: Start application
      run: |
        java -jar target/vulnerable-app-0.0.1-SNAPSHOT.jar &
        echo "Waiting for application to start..."
        sleep 30
    
    - name: Run ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.12.0
      with:
        target: 'http://localhost:8080'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'
        fail_action: false
    
    - name: Upload ZAP Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: zap-report
        path: |
          report_html.html
          report_md.md
        retention-days: 30
    
    - name: Stop application
      if: always()
      run: pkill -f vulnerable-app || true

  security-summary:
    name: Generate Security Summary
    runs-on: ubuntu-latest
    needs: [static-analysis, dynamic-analysis]
    if: always()
    
    steps:
    - name: Download all reports
      uses: actions/download-artifact@v4
      with:
        path: security-reports
    
    - name: Create summary comment
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request'
      with:
        script: |
          const fs = require('fs');
          const comment = `## 🔒 Security Audit Results
          
          Security scans have been completed. Please review the following reports:
          
          ### 📊 Available Reports
          - 🔍 Dependency Check Report
          - 🐛 SpotBugs Security Analysis  
          - 🌐 OWASP ZAP Dynamic Scan
          
          Download the artifacts to view detailed reports.
          
          ⚠️ **Action Required**: Review any HIGH or CRITICAL findings before merging.
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
