services:
  postgres:
    image: postgres:16-alpine
    container_name: vulnerable-app-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vulnerableappdb}
      POSTGRES_USER: ${POSTGRES_USER:-dbuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbpassword}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dbuser} -d ${POSTGRES_DB:-vulnerableappdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vulnerable-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod,seeder
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vulnerableappdb}
      DB_USERNAME: ${POSTGRES_USER:-dbuser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dbpassword}
      JWT_SECRET: ${JWT_SECRET:-docker-dev-secret-change-in-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  adminer:
    image: adminer:latest
    container_name: vulnerable-app-adminer
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: ${ADMINER_DESIGN:-nette}
    depends_on:
      - postgres
    networks:
      - app-network
    # Only enable in development - remove in production
    profiles:
      - dev

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
