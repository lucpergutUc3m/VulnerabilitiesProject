spring.application.name=VulnerableAppBackend

# Server Configuration
server.port=8080

# Database Configuration (H2 for development)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Properties
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration
# IMPORTANT: Change these values in production!
jwt.secret=CHANGE_THIS_TO_A_SECURE_RANDOM_STRING_AT_LEAST_256_BITS_LONG_FOR_PRODUCTION_USE
jwt.expiration=86400000

# CORS Configuration (adjust for your React frontend)
cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Vulnerability Mode (for testing purposes)
app.vulnerability-mode=false
