services:
  postgres:
    image: postgres:16-alpine
    container_name: vulnerable-app-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vulnerableappdb}
      POSTGRES_USER: ${POSTGRES_USER:-dbuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbpassword}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dbuser} -d ${POSTGRES_DB:-vulnerableappdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  adminer:
    image: adminer:latest
    container_name: vulnerable-app-adminer
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: ${ADMINER_DESIGN:-nette}
    depends_on:
      - postgres
    networks:
      - app-network
    # Only enable in development - remove in production
    profiles:
      - dev

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge