# Profile for local development WITHOUT Docker
# Uses file-based H2 database with web console

spring.datasource.url=jdbc:h2:file:${user.dir}/data/vulnerableapp-dev;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Enable H2 Console for GUI access
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
spring.h2.console.settings.trace=false

# Development settings
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT - weak secret for local dev only
jwt.secret=local-dev-secret-key-not-for-production-use-only
# Access token: 15 minutes (900000 ms)
jwt.expiration=900000
# Refresh token: 7 days (604800000 ms)
jwt.refresh.expiration=604800000

# CORS for local frontend
cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Debug mode
app.vulnerability-mode=false
