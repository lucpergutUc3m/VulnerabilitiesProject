spring.application.name=VulnerableAppBackend

# Disable Docker Compose auto-start (we'll run it manually)
spring.docker.compose.enabled=false

# Server Configuration
server.port=${SERVER_PORT:8080}

# Active Profile - Use 'local', 'docker-dev', or 'prod'
# Default to 'local,seeder' (H2 database, seeders enabled)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local,seeder}

app.vulnerability-mode=false

