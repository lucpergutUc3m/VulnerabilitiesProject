# Profile for development WITH Docker
# Uses PostgreSQL database with Adminer GUI

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vulnerableappdb}
spring.datasource.username=${DB_USERNAME:dbuser}
spring.datasource.password=${DB_PASSWORD:dbpassword}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Disable H2 console
spring.h2.console.enabled=false

# Development settings
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT - weak secret for dev only
jwt.secret=${JWT_SECRET:docker-dev-secret-key-not-for-production}
# Access token: 15 minutes (900000 ms)
jwt.expiration=900000
# Refresh token: 7 days (604800000 ms)
jwt.refresh.expiration=604800000

# CORS for local frontend
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Debug mode
app.vulnerability-mode=false
