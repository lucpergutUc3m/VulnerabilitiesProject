# ============================================
# PRODUCTION CONFIGURATION - VULNERABLE APP
# ============================================
# IMPORTANT: This is the default production config
# For local development, use: SPRING_PROFILES_ACTIVE=local,seeder
# For docker development, use: SPRING_PROFILES_ACTIVE=docker-dev,seeder
# ============================================

# Application Info
spring.application.name=VulnerableApp
server.port=${SERVER_PORT:8080}

# ============================================
# DATABASE CONFIGURATION (PostgreSQL)
# ============================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vulnerableapp}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Use 'update' to auto-create schema, 'validate' for strict production with pre-created schema
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Disable H2 console in production
spring.h2.console.enabled=false

# Production JPA settings - no SQL logging
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ============================================
# JWT CONFIGURATION
# ============================================
# CRITICAL: Override JWT_SECRET with a strong 256-bit+ random value in production!
jwt.secret=${JWT_SECRET:CHANGE_THIS_SECRET_IN_PRODUCTION_USE_STRONG_256_BIT_KEY}
# Access token: 24 hours (86400000 ms)
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.issuer=${JWT_ISSUER:VulnerableApp}
jwt.audience=${JWT_AUDIENCE:VulnerableApp-Users}

# ============================================
# SECURITY CONFIGURATION
# ============================================
# CORS - MUST be restricted to your actual frontend domain in production
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://yourdomain.com}

# Vulnerability mode - MUST be false in production
app.vulnerability-mode=${VULNERABILITY_MODE:false}

# ============================================
# ERROR HANDLING - Don't expose internals
# ============================================
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.root=INFO
logging.level.com.vulnerable.vulnerableapp=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=ERROR

# Log file configuration
logging.file.name=app.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================
# PERFORMANCE & CONNECTION POOL
# ============================================
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================
# SECURITY HEADERS
# ============================================
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=strict

# ============================================
# ACTUATOR (if enabled)
# ============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ============================================
# PRODUCTION SECURITY CHECKLIST
# ============================================
# 1. Set JWT_SECRET environment variable to a cryptographically strong random value
# 2. Configure HTTPS/TLS - set COOKIE_SECURE=true
# 3. Set CORS_ALLOWED_ORIGINS to your actual frontend domain only
# 4. Use environment variables for DB_PASSWORD
# 5. Set spring.jpa.hibernate.ddl-auto=validate (never update/create in prod)
# 6. Enable rate limiting at reverse proxy/load balancer level
# 7. Regular security audits and dependency updates
# 8. Monitor logs for suspicious authentication attempts
# ============================================